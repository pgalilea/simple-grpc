[project]
name = "simple-grpcio"
version = "0.1.5"
description = "SimpleGRPC - High-performance gRPC made simple. Write less code, ship to production faster."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Pablo Galilea", email = "pgalilea@me.com" },
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.5.0",
    "grpcio>=1.84.0",
    "grpcio-health-checking>=1.84.0",
    "grpcio-tools>=1.84.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "watchfiles>=1.3.0",
]

[build-system]
requires = ["uv_build>=0.10.0,<0.11"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-root = ""
module-name = "simple_grpc"
source-include = ["tests/**"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "F401",
    "F403",
    "B008"  # allow Depends(dependency)
]

[tool.ruff.lint.isort]
lines-after-imports = 2
force-sort-within-sections = true
combine-as-imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportInvalidTypeForm = "none"
reportArgumentType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
filterwarnings = []
